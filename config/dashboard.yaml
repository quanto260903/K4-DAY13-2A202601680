dashboard:
  schema_version: 1
  title: Day 13 AI Observability
  time_range_minutes: 60
  refresh_seconds: 30
  panels:
    - id: latency
      title: Latency percentiles
      source: /metrics
      events: [metrics_snapshot]
      fields: [latency_p50, latency_p95, latency_p99]
      aggregations: [p50, p95, p99]
      query: 'GET /metrics | latency_p50, latency_p95, latency_p99'
      unit: ms
      threshold:
        aggregation: p95
        operator: lte
        value: 3000

    - id: traffic
      title: Request traffic
      source: /metrics
      events: [metrics_snapshot]
      fields: [traffic]
      aggregations: [count, rate_per_minute]
      query: 'GET /metrics | traffic'
      unit: requests_per_minute
      threshold:
        aggregation: rate_per_minute
        operator: gte
        value: 1

    - id: errors
      title: Error rate and breakdown
      source: /metrics
      events: [metrics_snapshot]
      fields: [error_rate_pct, error_breakdown]
      aggregations: [error_rate_pct, count_by_value]
      query: 'GET /metrics | error_rate_pct, error_breakdown'
      unit: percent
      threshold:
        aggregation: error_rate_pct
        operator: lte
        value: 2

    - id: cost
      title: Cost over time
      source: /metrics
      events: [metrics_snapshot]
      fields: [total_cost_usd, avg_cost_usd]
      aggregations: [sum_by_minute, total]
      query: 'GET /metrics | total_cost_usd, avg_cost_usd'
      unit: usd
      threshold:
        aggregation: total
        operator: lte
        value: 2.5

    - id: tokens
      title: Input and output tokens
      source: /metrics
      events: [metrics_snapshot]
      fields: [tokens_in_total, tokens_out_total]
      aggregations: [sum_by_field]
      query: 'GET /metrics | tokens_in_total, tokens_out_total'
      unit: tokens
      threshold:
        aggregation: sum_by_field
        operator: lte
        value: 50000

    - id: quality
      title: Quality proxy
      source: /metrics
      events: [metrics_snapshot]
      fields: [quality_avg]
      aggregations: [mean]
      query: 'GET /metrics | quality_avg'
      unit: score_0_to_1
      threshold:
        aggregation: mean
        operator: gte
        value: 0.75
